plugins {
    id 'java'
}

group = 'net.client'
version = '1.0.0'

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

repositories {
    mavenCentral()
}

dependencies {
    // Only standard ASM bytecode library - no slow Minecraft servers needed
    implementation 'org.ow2.asm:asm-all:5.2'
}

tasks.withType(JavaCompile) {
    options.compilerArgs += ['-Xlint:none', '-nowarn']
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes(
            'TweakClass': 'net.client.launch.ClientTweaker',
            'Main-Class': 'net.minecraft.launchwrapper.Launch'
        )
    }
}
