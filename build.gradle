plugins {
    id 'java'
}

group = 'net.client'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
    maven { url 'https://libraries.minecraft.net/' }
    maven { url 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    // Launchwrapper & ASM for Client Tweaker / ASM Transformers
    compileOnly 'net.minecraft:launchwrapper:1.12'
    compileOnly 'org.ow2.asm:asm-all:5.2'

    // LWJGL (Keyboard, Display, rendering)
    compileOnly 'org.lwjgl.lwjgl:lwjgl:2.9.4-nightly-20150209'
    compileOnly 'org.lwjgl.lwjgl:lwjgl_util:2.9.4-nightly-20150209'

    // Optional: If you have a local minecraft.jar / 1.8.9 jar inside a 'libs' folder:
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}

tasks.withType(JavaCompile) {
    options.compilerArgs += ['-Xlint:none', '-nowarn']
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes(
            'TweakClass': 'net.client.launch.ClientTweaker',
            'Main-Class': 'net.minecraft.launchwrapper.Launch'
        )
    }
}
